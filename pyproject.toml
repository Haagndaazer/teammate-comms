[project]
name = "teammate-comms"
version = "0.17.3"
description = "Agent-to-agent messaging between coding-agent sessions, on one machine or between machines linked over Tailscale."
authors = [{ name = "ColtonDyck" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
# Pure stdlib — no third-party runtime dependencies (this is deliberate: it keeps
# the MCP spawn instant and avoids a dependency tree blocking the stdio handshake).
dependencies = []
keywords = ["mcp", "channel", "agent", "messaging"]

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
teammate-comms = "teammate_comms.server:main"
teammate-comms-peers = "teammate_comms.peers:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teammate_comms"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
